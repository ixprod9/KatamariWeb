<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:title" content="nananana katamari damacy">
<meta property="og:description" content="nananana katamari damacy">
<meta name="description" content="nananana katamari damacy">
<meta name="theme-color" content="#26c950">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="nananana katamari damacy">
<meta name="twitter:description" content="nananana katamari damacy">
<title>Katamari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/spawner.css">
<link rel="stylesheet" href="css/squish.css">
<!-- three.js r128 (global THREE) + legacy example loaders, then the app as ES modules -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>

<div id="app">
  <div class="tabs" role="tablist" aria-label="Mode">
    <button class="tab" role="tab" id="tSpawn" aria-controls="pSpawn" aria-selected="true">Spawner</button>
    <button class="tab" role="tab" id="tSquish" aria-controls="pSquish" aria-selected="false">Squish</button>
  </div>
  <div class="hint" id="hint"></div>
  <div class="hud" id="hud" hidden><div>Size <b id="hSize">36cm</b></div><div>Rolled up <b id="hCount">0</b></div></div>
  <div class="toast" id="toast"></div>

  <div class="pane" id="pSpawn" role="tabpanel" aria-labelledby="tSpawn"><div class="pane" id="stage"></div></div>
  <div class="pane" id="pSquish" role="tabpanel" aria-labelledby="tSquish" hidden><canvas id="c"></canvas></div>

  <div class="dock" id="dock">
    <div class="grp" id="gSpawn">
      <button class="btn" id="spawnBtn">Spawn Katamari</button>
      <button class="btn alt" id="clearBtn">Clear</button>
      <label class="btn alt" for="kImg">Image</label><input id="kImg" type="file" accept="image/*">
      <label class="tg" for="collisionToggle"><input type="checkbox" id="collisionToggle" checked> Collisions</label>
      <label class="tg" for="followToggle"><input type="checkbox" id="followToggle"> Follow Cursor</label>
      <label class="tg" for="rollToggle"><input type="checkbox" id="rollToggle"> Roll the Katamari</label>
    </div>
    <div class="grp" id="gSquish" hidden>
      <label class="btn" for="file">Load</label><input id="file" type="file" accept="image/*,.obj">
      <button class="btn alt" id="bReset">Reset</button>
      <label class="tg" for="freeze"><input type="checkbox" id="freeze"> Freeze</label>
      <label class="sl" for="rad">Grab <input id="rad" type="range" min="0.12" max="0.9" step="0.01" value="0.38"></label>
      <label class="sl" for="wob">Wobble <input id="wob" type="range" min="1" max="10" step="0.1" value="6"></label>
      <label class="tg" id="colLbl" for="col">Color <input type="color" id="col" value="#26c950"></label>
      <label class="tg" for="sound"><input type="checkbox" id="sound" checked> Sound</label>
    </div>
  </div>
  <div class="drop" id="drop" hidden>Drop it</div>
</div>

</body>
</html>

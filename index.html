  const hit=e.button===0?ray.intersectObject(mesh)[0]:null;
  pid=e.pointerId;cv.setPointerCapture(pid);lx=e.clientX;ly=e.clientY;
  if(hit){
    const f=hit.face,lp=mesh.worldToLocal(hit.point.clone());let best=f.a,bd=1e9;
    for(const v of[f.a,f.b,f.c]){const d=tmp.fromBufferAttribute(posA,v).distanceToSquared(lp);if(d<bd){bd=d;best=v}}
    const cx=REST[best*3],cy=REST[best*3+1],cz=REST[best*3+2],r=+$('rad').value,k=1/(2*r*r);
    for(let v=0;v<n;v++){const dx=REST[v*3]-cx,dy=REST[v*3+1]-cy,dz=REST[v*3+2]-cz,w=Math.exp(-(dx*dx+dy*dy+dz*dz)*k);W[v]=w<.002?0:w}
    startPt.copy(hit.point);camera.getWorldDirection(tmp);plane.setFromNormalAndCoplanarPoint(tmp,startPt);
    gd.set(0,0,0);prevLen=0;grabbing=true;sleeping=false;cv.classList.add('grabbing');sfx.grab();
  }else orbiting=true;
});
cv.addEventListener('pointermove',e=>{
  setNDC(e);
  if(e.pointerId===pid&&grabbing){
    ray.setFromCamera(ndc,camera);
    if(ray.ray.intersectPlane(plane,tmp)){tmp.sub(startPt);if(tmp.length()>3)tmp.setLength(3);mesh.getWorldQuaternion(q);q.invert();tmp.applyQuaternion(q);speedAcc+=tmp.distanceTo(gd);gd.copy(tmp)}
  }else if(e.pointerId===pid&&orbiting){
    yaw+=(e.clientX-lx)*.01;pitch=clamp(pitch+(e.clientY-ly)*.01,-1.2,1.2);lx=e.clientX;ly=e.clientY;
  }else if(pid===null&&mesh&&performance.now()-hoverT>90){
    hoverT=performance.now();ray.setFromCamera(ndc,camera);cv.classList.toggle('can-grab',ray.intersectObject(mesh).length>0);
  }
});
function endPtr(e){
  if(e.pointerId!==pid)return;pid=null;
  if(grabbing){
    grabbing=false;cv.classList.remove('grabbing');
    if(freeze)for(let v=0;v<n;v++){const w=W[v];if(w){BASE[v*3]+=w*gd.x;BASE[v*3+1]+=w*gd.y;BASE[v*3+2]+=w*gd.z}}
    freeze?sfx.blip():sfx.boing(gd.length());gd.set(0,0,0);
  }
  orbiting=false;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{if(pid===null){look.x*=.5;look.y*=.5}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();camera.position.z=clamp(camera.position.z*(1+Math.sign(e.deltaY)*.08),2.3,9)},{passive:false});
function reset(){if(!BASE)return;BASE.fill(0);sleeping=false;yaw=pitch=0;sfx.reset()}
$('bReset').onclick=()=>{initAudio();reset()};
$('freeze').onchange=e=>{freeze=e.target.checked;initAudio();sfx.blip()};
const setCol=v=>mat.color.set(v).convertSRGBToLinear();setCol($('col').value);
$('col').addEventListener('input',e=>setCol(e.target.value));
$('col').addEventListener('change',()=>{initAudio();sfx.blip()});
['rad','wob'].forEach(id=>$(id).addEventListener('change',()=>sfx.blip()));

addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;
  const k=e.key.toLowerCase();
  if(tab==='squish'){if(k==='r')reset();else if(k==='f')$('freeze').click()}
  else if(k==='k'){initAudio();spawn()}
});
addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it){initAudio();loadFile(it.getAsFile(),tab==='squish')}});
let dc=0;
const isFileDrag=e=>[...(e.dataTransfer?.types||[])].includes('Files');
const hideDrop=()=>{dc=0;$('drop').hidden=true};
addEventListener('dragenter',e=>{if(!isFileDrag(e))return;e.preventDefault();dc++;$('drop').hidden=false;$('drop').textContent=tab==='squish'?'Drop to squish':'Drop to set katamari image'});
addEventListener('dragover',e=>{if(isFileDrag(e))e.preventDefault()});
addEventListener('dragleave',e=>{if(--dc<=0||!e.relatedTarget)hideDrop()});
addEventListener('dragend',hideDrop);
addEventListener('pointerdown',hideDrop,true);
addEventListener('blur',hideDrop);
addEventListener('drop',e=>{e.preventDefault();hideDrop();if(!e.dataTransfer?.files?.length)return;initAudio();loadFile(e.dataTransfer.files[0],tab==='squish')});

function resize(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?52:38;camera.updateProjectionMatrix()}
addEventListener('resize',()=>{resize();placeDock()});

function sim(dt){
  if(sleeping&&!grabbing)return;
  const k=260,c=26-(+$('wob').value)*2.4,h=dt/2,gx=gd.x,gy=gd.y,gz=gd.z;let e=0;
  for(let s=0;s<2;s++)for(let v=0;v<n;v++){
    const w=grabbing?W[v]:0,i=v*3;
    let a=k*(BASE[i]+w*gx-D[i])-c*V[i];V[i]+=a*h;D[i]+=V[i]*h;
    a=k*(BASE[i+1]+w*gy-D[i+1])-c*V[i+1];V[i+1]+=a*h;D[i+1]+=V[i+1]*h;
    a=k*(BASE[i+2]+w*gz-D[i+2])-c*V[i+2];V[i+2]+=a*h;D[i+2]+=V[i+2]*h;
    if(s)e+=V[i]*V[i]+V[i+1]*V[i+1]+V[i+2]*V[i+2];
  }
  const P=posA.array;for(let i=0;i<n*3;i++)P[i]=REST[i]+D[i];
  posA.needsUpdate=true;geo.computeVertexNormals();
  if(!grabbing&&e<1e-7*n)sleeping=true;
}
const clock=new THREE.Clock();let T=0,ry=0,rx=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),1/30);T+=dt;
  if(tab==='spawn'){stepSpawner(dt);return}
  if(mesh)sim(dt);
  if(!grabbing){const f=Math.min(1,dt*6),m=isImg?.6:1;ry+=(yaw+look.x*.5*m-ry)*f;rx+=(pitch-look.y*.3*m-rx)*f;pivot.rotation.set(rx,ry,0)}
  pivot.position.y=Math.sin(T*1.7)*.035;
  if(AC){
    speed+=(speedAcc/dt-speed)*.25;speedAcc=0;const len=gd.length();
    cG.gain.setTargetAtTime(grabbing?Math.min(.08,speed*.025):0,AC.currentTime,.04);
    cO.frequency.setTargetAtTime(110+len*230,AC.currentTime,.05);cF.frequency.setTargetAtTime((110+len*230)*4,AC.currentTime,.05);
    if(grabbing&&Math.floor(len*4)>Math.floor(prevLen*4))tone('sine',500+len*300,800+len*300,.05,.05);
    prevLen=len;
  }
  renderer.render(scene,camera);
}
setTab(location.hash==='#squish'?'squish':'spawn');
loadKatIntoSquish();spawn();frame();
</script>
</body>
